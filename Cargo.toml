[package]
name = "RootAsRole-utils"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gensr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
posix-acl = "1.2.0"
rootasrole-core = "3.3.0"
serde = { version = "1.0.217", features = ["derive"]}
serde_json = "1.0.149"
nix = { version = "0.29", features = ["user"] }
clap = { version = "4.5.54", features = ["derive"] }
bitflags = "2.10.0"
sha2 = "0.10.9"
hex = "0.4.3"
sxd-document = "0.3.2"
env_logger = "0.11.8"
log = "0.4.29"
tempfile = "3.24.0"
capctl = "0.2.4"
bon = "3.8.2"
which = "8.0.0"
